services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: agrirelay
      POSTGRES_USER: agrirelay
      POSTGRES_PASSWORD: agrirelay
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrirelay"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
  pulsar:
    image: apachepulsar/pulsar:4.0.3
    command: bin/pulsar standalone
    ports: ["6650:6650", "8080:8080"]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.124.1
    ports: ["4317:4317"]
